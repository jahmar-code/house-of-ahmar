name: Promote verified revision

# Production gate (follow-up audit OP-02). Direct pushes to master stay the
# owner's workflow; this deploys ONLY the exact commit that "App verification"
# just passed, and only while it is still master's tip. It is inert until the
# owner enables it — see docs/pkm/50-operations/release-runbook.md, which also
# covers turning off Vercel's own Git-triggered production deploys in the same
# change. It never runs database migrations.
on:
  workflow_run:
    workflows: ["App verification"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      vars.HOA_PROMOTE_VERIFIED == 'true' &&
      vars.VERCEL_CLI_VERSION != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - name: Refuse a superseded revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            echo "master moved to $tip; its own verification run decides promotion."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # No secrets in this step: dependency install scripts never see the token.
      - run: npm ci
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      # The CLI reads VERCEL_TOKEN from the environment; it is never an argument.
      - name: Pull production settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      - name: Build the verified commit
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod
      - name: Deploy and record the promoted deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prebuilt --prod)"
          echo "Promoted $SHA as $url" >> "$GITHUB_STEP_SUMMARY"
